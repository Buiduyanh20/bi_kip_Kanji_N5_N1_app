name: bikip_kanji_app

description: "Bí Kíp Kanji - Ứng dụng học Kanji tiếng Nhật từ N5 đến N1 cho người Việt."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.0
  go_router: ^14.0.0
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  file_picker: ^8.0.0   # cho import backup
  share_plus: ^9.0.0    # cho export backup
  kana_kit: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/kanji/
    - assets/data/vocabulary/